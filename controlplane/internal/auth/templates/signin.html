<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - AO</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d12;
      color: #e6e8eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #151821;
      border: 1px solid #262b36;
      border-radius: 12px;
      padding: 2.5rem;
      width: 320px;
      text-align: center;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 1.5rem;
    }
    a.button {
      display: block;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 600;
    }
    a.button:hover {
      background: #2563eb;
    }
    p.error {
      color: #f87171;
      font-size: 0.875rem;
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in to AO</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <a class="button" href="{{.LoginURL}}">Continue with Google</a>
  </div>
</body>
</html>
